<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LILYGO T-Display-S3 · Spider-Man PC-98 Dual-Button Combat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="handheld-shell">

    <!-- Top Compact Hardware Control Bar -->
    <div class="top-bar flex items-center justify-between gap-1 w-full max-w-[580px] px-1 flex-wrap">
      <div class="flex items-center gap-1">
        <button id="btn-cam" type="button" class="pill-btn active rounded-full px-2.5 py-1.5 text-[10px] sm:text-[11px] font-bold tracking-wide text-slate-100">
          CAM: 3RD
        </button>
        <button id="btn-shadow" type="button" class="pill-btn active rounded-full px-2.5 py-1.5 text-[10px] sm:text-[11px] font-bold tracking-wide text-slate-100">
          SHADOWS: ON
        </button>
        <button id="btn-scanline" type="button" class="pill-btn rounded-full px-2.5 py-1.5 text-[10px] sm:text-[11px] font-bold tracking-wide text-slate-300">
          SCANLINE: OFF
        </button>
      </div>
      <div class="flex items-center gap-1">
        <span id="fps-badge" class="text-[10px] font-mono text-sky-300 bg-slate-900/85 border border-slate-700/80 rounded-full px-2 py-1">
          60 FPS
        </span>
        <button id="btn-reset" type="button" class="pill-btn rounded-full px-2.5 py-1.5 text-[10px] sm:text-[11px] font-bold tracking-wide text-rose-300 border-rose-500/40">
          RESET
        </button>
      </div>
    </div>

    <!-- Center LILYGO T-Display-S3 Hardware Frame & Native 320x170 LCD -->
    <div class="bezel-wrap">
      <div class="tdisplay-pcb rounded-2xl p-2 sm:p-2.5">
        <div class="pin-row mb-1.5">
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Side hardware button & USB-C port accents -->
          <div class="hidden sm:flex flex-col items-center justify-between self-stretch py-2 px-0.5">
            <div class="w-1.5 h-3 rounded-sm bg-slate-600/80 border border-slate-400/40" title="IO0 STRIKE"></div>
            <div class="w-2 h-7 rounded-sm bg-gradient-to-b from-slate-300 to-slate-500 border border-slate-200/50" title="USB-C"></div>
            <div class="w-1.5 h-3 rounded-sm bg-slate-600/80 border border-slate-400/40" title="IO14 SWING"></div>
          </div>

          <div class="lcd-well flex-1 rounded-lg p-1 overflow-hidden">
            <canvas id="lcd" width="320" height="170"></canvas>
          </div>
        </div>

        <div class="flex items-center justify-between px-2 mt-1.5">
          <span class="text-[9px] font-mono tracking-wider text-slate-400 font-semibold">
            LILYGO T-Display-S3 · 320×170 · ESP32-S3R8
          </span>
          <span id="stage-badge" class="text-[9px] font-mono text-sky-300/90 flex items-center gap-1">
            <span id="stage-dot" class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="stage-label">PC-98 · SUMMER DAY</span>
          </span>
        </div>

        <div class="pin-row mt-1">
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
          <span class="pin-pad"></span><span class="pin-pad"></span><span class="pin-pad"></span>
        </div>
      </div>

      <div class="desktop-hint text-center mt-1.5 text-[11px] text-slate-400/90 leading-snug px-2">
        <span class="text-cyan-300 font-semibold">모든 공격은 STRIKE(E/F/Shift) 수동 발동!</span> ·
        <span class="text-amber-300 font-semibold">C1 하강 내리찍기</span> ·
        <span class="text-fuchsia-300 font-semibold">C3 카툰 정지·당기기 (SPD 160+ 무정지 즉시 돌진)</span>
      </div>
    </div>

    <!-- Bottom Dual-Thumb Multi-Touch Controls -->
    <div class="controls-row">
      <!-- Left Virtual Analog Joystick (IO1 / IO2) -->
      <div class="left-pad-zone flex flex-col items-center gap-1.5">
        <div id="joy-base" class="joy-base w-32 h-32 sm:w-36 sm:h-36 rounded-full flex items-center justify-center">
          <div class="joy-ring w-20 h-20 rounded-full pointer-events-none"></div>
          <span class="absolute top-2 text-[8px] font-mono text-sky-300/80 pointer-events-none">W·UP</span>
          <span class="absolute bottom-2 text-[8px] font-mono text-emerald-300/80 pointer-events-none">S·GLIDE</span>
          <span class="absolute left-2.5 text-[9px] font-mono text-slate-500 pointer-events-none">A</span>
          <span class="absolute right-2.5 text-[9px] font-mono text-slate-500 pointer-events-none">D</span>
          <div id="joy-knob" class="joy-knob w-12 h-12 sm:w-14 sm:h-14 rounded-full pointer-events-none flex items-center justify-center">
            <div class="w-4 h-4 rounded-full bg-slate-900/60 border border-slate-500/40"></div>
          </div>
        </div>
        <span class="text-[10px] font-mono text-slate-400 tracking-wide">STICK · IO1/2</span>
      </div>

      <!-- Right Dual Tactile Buttons: STRIKE (IO0) + SWING (IO14) -->
      <div class="right-btn-zone flex flex-col items-center gap-1.5">
        <div class="flex items-end gap-2.5 sm:gap-3.5">
          <!-- Tactile Button 1: STRIKE (GPIO 0 / E / F / Shift) -->
          <button id="btn-strike" type="button" class="strike-btn w-24 h-24 sm:w-28 sm:h-28 rounded-full flex flex-col items-center justify-center mb-2">
            <svg class="w-7 h-7 mb-0.5 pointer-events-none" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <circle cx="18" cy="18" r="10" stroke-dasharray="5 3" />
              <line x1="18" y1="4" x2="18" y2="11" />
              <line x1="18" y1="25" x2="18" y2="32" />
              <line x1="4" y1="18" x2="11" y2="18" />
              <line x1="25" y1="18" x2="32" y2="18" />
              <circle cx="18" cy="18" r="2.5" fill="currentColor" />
            </svg>
            <span id="strike-btn-label" class="text-[11px] font-extrabold tracking-wide pointer-events-none">STRIKE</span>
            <span id="strike-btn-sub" class="text-[8.5px] font-mono opacity-85 pointer-events-none">NO LOCK</span>
          </button>

          <!-- Tactile Button 2: SWING (GPIO 14 / SPACE) -->
          <button id="btn-swing" type="button" class="swing-btn w-[104px] h-[104px] sm:w-[112px] sm:h-[112px] rounded-full flex flex-col items-center justify-center text-white">
            <svg class="w-7 h-7 mb-0.5 opacity-95 pointer-events-none" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="24" y1="4" x2="24" y2="44" />
              <line x1="4" y1="24" x2="44" y2="24" />
              <line x1="9.8" y1="9.8" x2="38.2" y2="38.2" />
              <line x1="38.2" y1="9.8" x2="9.8" y2="38.2" />
              <polygon points="24,13 31.8,16.2 35,24 31.8,31.8 24,35 16.2,31.8 13,24 16.2,16.2" stroke-width="1.8" opacity="0.85"/>
              <polygon points="24,18.5 27.9,20.1 29.5,24 27.9,27.9 24,29.5 20.1,27.9 18.5,24 20.1,20.1" stroke-width="1.6" opacity="0.7"/>
            </svg>
            <span id="swing-btn-label" class="text-[11px] font-extrabold tracking-wider pointer-events-none">SWING</span>
            <span id="swing-btn-sub" class="text-[8.5px] font-mono opacity-85 mt-0.5 pointer-events-none">HOLD / JUMP</span>
          </button>
        </div>
        <span class="text-[10px] font-mono text-slate-400 tracking-wide">TACTILE 1: STRIKE(E/SHIFT) · 2: SWING(SPACE)</span>
      </div>
    </div>

  </div>

  <script src="assets.js"></script>
  <script src="augments.js"></script>
  <script src="game.js"></script>
</body>
</html>
